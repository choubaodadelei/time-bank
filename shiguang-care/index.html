<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#234c3c"><meta name="description" content="时光养老，以时间互助连接居家照护、志愿服务与家属关怀。"><title>时光养老 · 让陪伴跨越山海</title><link rel="stylesheet" href="./style.css"></head><body>
<aside class="sidebar"><a class="brand" href="#home"><span class="brand-mark">◷</span><span>时光养老<small>TIME WITH YOU</small></span></a><p class="motto">让每一段时光，都被温柔以待</p><nav aria-label="主导航" id="nav"></nav><div class="sidebar-bottom">岁月有爱<br>时光不老<span>A WARMER TOMORROW</span></div></aside>
<div class="shell"><header><div><strong id="greeting">你好，欢迎回家</strong><p>陪伴是最长情的守护。</p></div><div class="header-actions"><span class="demo-dot">本地演示</span><button class="text-button" id="large-text" aria-pressed="false">大字模式</button><button class="family-button" data-route="family">我的家庭 <span>↗</span></button></div></header><main id="app"></main><footer>时光养老 · 寄出跨越千山万水的爱<span>演示数据仅存于当前浏览器，不会派单或通知他人。</span></footer></div>
<dialog id="modal"><form id="booking-form"><div class="dialog-top"><span>为在意的人，安排一份关怀</span><button type="button" class="close" aria-label="关闭弹窗">×</button></div><h2 id="dialog-title">预约服务</h2><p id="dialog-desc"></p><label>关怀对象<input value="林阿姨（演示人物）" readonly></label><div class="form-grid"><label>服务日期<input name="date" type="date" required></label><label>服务时间<select name="time"><option>09:00</option><option>10:30</option><option>12:00</option><option>14:00</option><option>16:00</option></select></label></div><label>服务地点<input name="place" required maxlength="60" placeholder="请填写演示地点，不要输入真实住址"></label><label>服务备注<textarea name="note" rows="3" maxlength="200" placeholder="例如：希望服务人员提前确认时间"></textarea></label><p class="notice">这是本地体验预约，不会产生真实服务或费用。</p><p id="form-error" role="alert"></p><button class="primary" type="submit" id="submit-booking">确认预约</button></form></dialog><div id="toast" role="status" aria-live="polite"></div><script src="./app.js"></script></body></html>
